apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: freshfood-secret-sync
  namespace: freshfood
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: freshfood-secret-sync
  namespace: freshfood
subjects:
  - kind: ServiceAccount
    name: secrets-store-csi-driver
    namespace: aws-secrets-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: freshfood-secret-sync
