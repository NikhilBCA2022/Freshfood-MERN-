apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: freshfood-backend-secrets
  namespace: freshfood
spec:
  provider: aws

  secretObjects:
    - secretName: freshfood-backend-secrets
      type: Opaque
      data:
        - objectName: MONGO_URI
          key: MONGO_URI
        - objectName: JWT_SECRET
          key: JWT_SECRET


  parameters:
    region: ap-south-1
    objects: |
      - objectName: "freshfood/dev/backend"
        objectType: "secretsmanager"
        jmesPath:
          - path: MONGO_URI
            objectAlias: MONGO_URI
          - path: JWT_SECRET
            objectAlias: JWT_SECRET
