apiVersion: v1
kind: Pod
metadata:
  name: freshfood-secret-sync-test
  namespace: freshfood
spec:
  serviceAccountName: freshfood-backend
  containers:
    - name: test
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: secrets-store
          mountPath: /mnt/secrets-store
          readOnly: true
  volumes:
    - name: secrets-store
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: freshfood-backend-secrets
