apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshfood-frontend
  namespace: freshfood
spec:
  replicas: 2
  selector:
    matchLabels:
      app: freshfood-frontend
  template:
    metadata:
      labels:
        app: freshfood-frontend
    spec:
      containers:
        - name: frontend
          image: REPLACE_WITH_FRONTEND_ECR_IMAGE
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
